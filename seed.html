<!DOCTYPE html>
<html><body>
<h2>Limpando e populando banco de dados... Aguarde!</h2>
<div id="log" style="font-family: monospace; background: #eee; padding: 10px;"></div>
<script type="module">
import { firebaseConfig } from './js/firebase/config.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, setDoc, addDoc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');

const app=initializeApp(firebaseConfig); 
const auth=getAuth(app); 
const db=getFirestore(app);

const logEl = document.getElementById('log');
function log(msg) {
  logEl.innerHTML += msg + "<br>";
}

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    log("<b>Erro:</b> Você precisa estar logado no sistema para fazer isso. Abra o painel em outra aba e recarregue esta página.");
    return;
  }
  log("Usuário autenticado. Iniciando limpeza...");
  
  try {
    // Tipos de servico
    const tSnap = await getDocs(collection(db, 'tiposServico'));
    const existingTipos = [];
    for(const d of tSnap.docs) {
      const nome = d.data().Nome || '';
      if(!nome.trim() || nome.startsWith('') || nome.startsWith('?') || nome === '') {
        await deleteDoc(d.ref);
        log('Apagado tipo inválido/vazio: ' + d.id);
      } else {
        existingTipos.push(nome.trim());
      }
    }
    const requiredTipos = ["Consultoria", "Acompanhamento", "Revisão", "Projeto Completo", "Projeto e Execução da Obra"];
    for(const t of requiredTipos) {
      if(!existingTipos.includes(t)) {
        await addDoc(collection(db, 'tiposServico'), {Nome: t});
        log('Adicionado tipo: ' + t);
      }
    }

    // Status de servico
    const sSnap = await getDocs(collection(db, 'statusServico'));
    const existingStatus = [];
    for(const d of sSnap.docs) {
      const nome = d.data().Nome || '';
      if(!nome.trim() || nome.startsWith('') || nome.startsWith('?') || nome === '') {
        await deleteDoc(d.ref);
        log('Apagado status inválido/vazio: ' + d.id);
      } else {
        existingStatus.push(nome.trim());
      }
    }
    const requiredStatus = [
      {Nome: "Entrevista", ordem: 1, cor: "#0A58CA"},
      {Nome: "Visita Técnica", ordem: 2, cor: "#F58220"},
      {Nome: "Desenho", ordem: 3, cor: "#6F42C1"},
      {Nome: "Orçamento", ordem: 4, cor: "#20C997"},
      {Nome: "Pagamento", ordem: 5, cor: "#198754"}
    ];
    for(const s of requiredStatus) {
      if(!existingStatus.includes(s.Nome)) {
        await addDoc(collection(db, 'statusServico'), s);
        log('Adicionado status: ' + s.Nome);
      }
    }

    log("<b>SUCESSO! O banco de dados foi limpo e os itens corretos recriados. Pode fechar esta página.</b>");
  } catch(e) {
    log("Erro: " + e.message);
  }
});
</script>
</body></html>

﻿﻿﻿﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Relat&#243;rios &#8212; Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">&#9776;</button>
      <div><div class="topbar-title">Relat&#243;rios</div><div class="topbar-subtitle">An&#225;lise e exporta&#231;&#227;o</div></div>
      <div class="topbar-actions">
        <button class="btn btn-secondary" onclick="window.print()">?&#128424; Imprimir</button>
        <button class="btn btn-danger" id="btn-pdf">?? PDF</button>
        <button class="btn btn-success" id="btn-excel">&#128229; Excel</button>
      </div>
    </div>
    <div class="page-content" id="relatorio-area">
      <!-- Filters -->
      <div class="card no-print" style="margin-bottom:20px">
        <div class="card-header"><div class="card-title"><span class="icon">&#128200;</span>Filtros</div></div>
        <div class="form-grid form-grid-3">
          <div class="form-group"><label class="form-label">Data In&#237;cio</label><input type="date" class="form-control" id="f-inicio"></div>
          <div class="form-group"><label class="form-label">Data Fim</label><input type="date" class="form-control" id="f-fim"></div>
          <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="f-status"><option value="">Todos</option></select></div>
          <div class="form-group"><label class="form-label">Tipo de Servi&#231;o</label><select class="form-select" id="f-tipo"><option value="">Todos</option></select></div>
          <div class="form-group"><label class="form-label">Cliente</label><input type="text" class="form-control" id="f-cliente" placeholder="Nome do cliente"></div>
          <div class="form-group" style="display:flex;align-items:flex-end">
            <button class="btn btn-primary" id="btn-filtrar" style="width:100%;justify-content:center">&#128269; Filtrar</button>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stat-grid" id="rel-stats"></div>

      <!-- Charts -->
      <div class="chart-grid" id="charts-area">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><span class="icon">&#128202;</span>Por Status</div>
            <div class="chart-type-btns" id="chart1-btns">
              <button class="chart-type-btn active" data-type="bar">Barra</button>
              <button class="chart-type-btn" data-type="pie">Pizza</button>
              <button class="chart-type-btn" data-type="doughnut">Donut</button>
            </div>
          </div>
          <div class="chart-wrapper"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-title"><span class="icon">&#128203;</span>Por Tipo</div>
            <div class="chart-type-btns" id="chart2-btns">
              <button class="chart-type-btn active" data-type="pie">Pizza</button>
              <button class="chart-type-btn" data-type="bar">Barra</button>
              <button class="chart-type-btn" data-type="doughnut">Donut</button>
            </div>
          </div>
          <div class="chart-wrapper"><canvas id="chart-tipo"></canvas></div>
        </div>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0">
        <div class="card-header" style="padding:16px 20px">
          <div class="card-title"><span class="icon">&#128200;</span>Listagem Detalhada</div>
          <span id="rel-count" style="color:var(--text-3);font-size:13px"></span>
        </div>
        <div class="table-wrapper">
          <table class="data-table" id="rel-table">
            <thead><tr><th>N&#186;</th><th>Data</th><th>Cliente</th><th>Tipo</th><th>Status</th><th>Entrega</th></tr></thead>
            <tbody id="rel-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatDate, buildStatusBadge, exportToExcel, setActiveNav, setupMobileSidebar } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let allDemandas=[],allStatus=[],charts={};
const COLORS=['#C9A84C','#3498DB','#2ECC71','#E74C3C','#9B59B6','#F39C12','#1ABC9C','#E67E22','#34495E','#16A085'];

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.nome||user.email,u.perfil||'Usu&#225;rio');
  const [dSnap,sSnap,tSnap]=await Promise.all([getDocs(query(collection(db,'demandas'),orderBy('criadoEm','desc'))),getDocs(collection(db,'statusServico')),getDocs(collection(db,'tiposServico'))]);
  allDemandas=dSnap.docs.map(d=>({id:d.id,...d.data()}));
  allStatus=sSnap.docs.map(d=>({id:d.id,...d.data()}));
  const fSt=document.getElementById('f-status'); sSnap.docs.forEach(d=>fSt.appendChild(new Option(d.data().nome,d.id)));
  const fTp=document.getElementById('f-tipo');   tSnap.docs.forEach(d=>fTp.appendChild(new Option(d.data().nome,d.id)));
  renderReport(allDemandas);
});

function renderSidebar(nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">&#128202;</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">&#128203;</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">&#128193;&#65039;</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">&#128197;</span>Calend&#225;rio</a>
      <a href="orcamento.html"><span class="nav-icon">&#128176;</span>Or&#231;amentos</a>
      <a href="relatorios.html"><span class="nav-icon">&#128200;</span>Relat&#243;rios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">&#128101;</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">&#127981;</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">&#129521;</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">&#128296;</span>Servi&#231;os</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? `<a href="usuarios.html"><span class="nav-icon">&#128100;</span>Usu&#225;rios</a>` : ''}
      <a href="agenda.html"><span class="nav-icon">&#128218;</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">&#128161;</span>Sugest&#245;es</a>
      <a href="creditos.html"><span class="nav-icon">&#11088;</span>Cr&#233;ditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '&#127769;' : '&#9728;&#65039;'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usu&#225;rio'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>&#128682;</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActiveNav();
  setupMobileSidebar();
}

document.getElementById('btn-filtrar').addEventListener('click',()=>{
  const inicio=document.getElementById('f-inicio').value;
  const fim=document.getElementById('f-fim').value;
  const st=document.getElementById('f-status').value;
  const tp=document.getElementById('f-tipo').value;
  const cli=document.getElementById('f-cliente').value.toLowerCase().trim();
  let list=[...allDemandas];
  if(inicio) list=list.filter(d=>{const dt=d.criadoEm?.toDate?.();return dt&&dt>=new Date(inicio);});
  if(fim)    list=list.filter(d=>{const dt=d.criadoEm?.toDate?.();return dt&&dt<=new Date(fim+'T23:59:59');});
  if(st)     list=list.filter(d=>d.statusId===st);
  if(tp)     list=list.filter(d=>d.tipoServicoId===tp);
  if(cli)    list=list.filter(d=>(d.clienteNome||'').toLowerCase().includes(cli));
  renderReport(list);
});

function renderReport(list){
  // Stats
  document.getElementById('rel-stats').innerHTML=`
    <div class="stat-card"><span class="stat-icon">&#128202;</span><div class="stat-label">TOTAL</div><div class="stat-value">${list.length}</div></div>
    <div class="stat-card"><span class="stat-icon">&#128229;</span><div class="stat-label">ATIVOS</div><div class="stat-value">${list.filter(d=>!d.arquivada).length}</div></div>
    <div class="stat-card"><span class="stat-icon">&#128229;</span><div class="stat-label">ARQUIVADOS</div><div class="stat-value">${list.filter(d=>d.arquivada).length}</div></div>
    <div class="stat-card"><span class="stat-icon">&#128176;</span><div class="stat-label">COM OR&#199;AMENTO</div><div class="stat-value">${list.filter(d=>d.temOrcamento).length}</div></div>`;

  // Charts
  const byStatus={},byTipo={};
  list.forEach(d=>{
    byStatus[d.statusNome||'Sem status']=(byStatus[d.statusNome||'Sem status']||0)+1;
    byTipo[d.tipoServicoNome||'Sem tipo']=(byTipo[d.tipoServicoNome||'Sem tipo']||0)+1;
  });
  buildChart('chart-status','bar',Object.keys(byStatus),Object.values(byStatus),'chart1-btns',(t)=>buildChart('chart-status',t,Object.keys(byStatus),Object.values(byStatus)));
  buildChart('chart-tipo','pie',Object.keys(byTipo),Object.values(byTipo),'chart2-btns',(t)=>buildChart('chart-tipo',t,Object.keys(byTipo),Object.values(byTipo)));

  // Table
  document.getElementById('rel-count').textContent=list.length+' registro(s)';
  const tbody=document.getElementById('rel-tbody');
  if(!list.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-3)">Nenhum dado no per&#237;odo</td></tr>';return;}
  tbody.innerHTML=list.map(d=>{
    const st=allStatus.find(s=>s.id===d.statusId);
    return `<tr><td>#${d.numero||'�'}</td><td>${formatDate(d.criadoEm)}</td><td>${d.clienteNome||'�'}</td>
    <td>${d.tipoServicoNome||'�'}</td><td>${buildStatusBadge(d.statusNome||'�',st?.cor)}</td>
    <td>${formatDate(d.dataEntrega)}</td></tr>`;
  }).join('');
}

function buildChart(canvasId,type,labels,data,btnsId,onTypeChange){
  if(charts[canvasId])charts[canvasId].destroy();
  const ctx=document.getElementById(canvasId); if(!ctx)return;
  const isPie=type==='pie'||type==='doughnut';
  charts[canvasId]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:COLORS.slice(0,data.length).map(c=>c+'CC'),borderColor:COLORS.slice(0,data.length),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:isPie,position:'right',labels:{color:'#B0B3C8',font:{size:11},padding:14,boxWidth:14}}},
    scales:isPie?{}:{x:{ticks:{color:'#6E7191'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#6E7191',stepSize:1},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:true}}}});
  if(btnsId&&onTypeChange){
    document.getElementById(btnsId)?.querySelectorAll('.chart-type-btn').forEach(btn=>{
      btn.classList.toggle('active',btn.dataset.type===type);
      btn.onclick=()=>{document.getElementById(btnsId).querySelectorAll('.chart-type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');onTypeChange(btn.dataset.type);};
    });
  }
}

// Excel
document.getElementById('btn-excel').addEventListener('click',()=>{
  const list=allDemandas;
  exportToExcel(list.map(d=>({'N&#186;':d.numero,'Data':formatDate(d.criadoEm),'Cliente':d.clienteNome||'','Tipo':d.tipoServicoNome||'','Status':d.statusNome||'','Arquivada':d.arquivada?'Sim':'N&#227;o','Entrega':formatDate(d.dataEntrega)})),'relatorio-excellentia');
  showToast('Excel exportado!','success');
});

// PDF
document.getElementById('btn-pdf').addEventListener('click',async()=>{
  const el=document.getElementById('relatorio-area');
  const canvas=await html2canvas(el,{scale:1.5,backgroundColor:'#1A1A2E',useCORS:true});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const w=pdf.internal.pageSize.getWidth(); const h=(canvas.height/canvas.width)*w;
  pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,w,Math.min(h,297));
  pdf.save(`relatorio-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.pdf`);
  showToast('PDF gerado!','success');
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Orçamentos — Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <div><div class="topbar-title">Orçamentos</div><div class="topbar-subtitle">Gestão de Orçamentos</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btn-novo">+ Novo Orçamento</button></div>
    </div>
    <div class="page-content">
      <div class="card" style="padding:0">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Cliente</th><th>Tipo</th><th>Valor</th><th>Com Desconto</th><th>Entrega</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="list-tbody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-3)">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: novo/Editar Orçamento -->
<div class="modal-overlay" id="modal-form">
  <div class="modal modal-lg">
    <div class="modal-header"><span class="modal-title"><span id="modal-titulo">Novo Orçamento</span></span><button class="modal-close" id="close-modal">✕</button></div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-danger" style="display:none"></div>
      <div class="form-grid">
        <div class="form-group col-span-2">
          <label class="form-label">Cliente</label>
          <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-cliente" placeholder="Nome do cliente"><div class="autocomplete-list" id="cli-auto"></div></div>
          <input type="hidden" id="f-cliente-id">
        </div>
        <div class="form-group"><label class="form-label">Tipo de Serviço</label>
          <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-tipo" placeholder="Tipo de serviço"><div class="autocomplete-list" id="tipo-auto"></div></div>
        </div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="f-status"><option value="">Selecionar</option></select>
        </div>
        <!-- Container Serviços do Orçamento -->
        <div class="form-group col-span-2" style="background:var(--surface-2); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div style="font-weight:bold; font-size:14px;">Serviços do Orçamento</div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-servico" style="padding:4px 10px; font-size:12px;">+ Adicionar Serviço</button>
          </div>
          <div id="lista-servicos-container" style="display:flex; flex-direction:column; gap:8px;">
            <!-- Linhas de serviços dinâmicas -->
          </div>
        </div>
        <div class="form-group"><label class="form-label">Data do Serviço</label>
          <input type="date" class="form-control" id="f-data">
        </div>
        <div class="form-group"><label class="form-label">Prazo (dias)</label>
          <input type="number" class="form-control" id="f-prazo" placeholder="Ex: 30" min="0">
        </div>
        <div class="form-group"><label class="form-label">Data de Entrega (calculada)</label>
          <input type="text" class="form-control" id="f-entrega" readonly style="opacity:0.6">
        </div>
        <div class="form-group"><label class="form-label">Valor do Orçamento (Aprovados)</label>
          <input type="number" class="form-control" id="f-valor" placeholder="0,00" step="0.01" min="0" readonly style="background:var(--surface-2); font-weight:bold;">
        </div>
        <div class="form-group"><label class="form-label">Forma de Pagamento</label>
          <select class="form-select" id="f-forma-pagamento">
            <option value="">Não informada</option>
            <option value="Cartão">Cartão</option>
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Boleto">Boleto</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Opção de Pagamento</label>
          <select class="form-select" id="f-opcao-pagamento">
            <option value="">Não informada</option>
            <option value="À vista">À vista</option>
            <option value="Parcelado">Parcelado</option>
          </select>
        </div>
        
        <!-- Status Pagamento À Vista / Outros (Nao Parcelado) -->
        <div class="form-group" id="container-status-pagamento" style="display:none;">
          <label class="form-label">Status do Pagamento</label>
          <select class="form-select" id="f-status-pagamento">
            <option value="Em Espera">Em Espera</option>
            <option value="Pagamento Efetivado">Pagamento Efetivado</option>
          </select>
        </div>
        <div class="form-group" id="container-data-pagamento" style="display:none;">
          <label class="form-label">Data do Pagamento</label>
          <input type="date" class="form-control" id="f-data-pagamento">
        </div>
        <div class="form-group" id="container-valor-pago" style="display:none;">
          <label class="form-label">Valor Pago</label>
          <input type="number" class="form-control" id="f-valor-pago" step="0.01">
        </div>

        <!-- Container Parcelamento -->
        <div class="form-group col-span-2" id="container-parcelamento" style="display:none; background:var(--surface-2); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle);">
          <div style="font-weight:bold; margin-bottom:12px; font-size:14px;">Parcelamento</div>
          <div class="form-row" style="align-items:flex-end;">
            <div class="form-group" style="flex:1"><label class="form-label">Nº de Parcelas</label>
              <input type="number" class="form-control" id="f-num-parcelas" min="1" max="48" placeholder="Ex: 3">
            </div>
            <div class="form-group" style="flex:0"><button type="button" class="btn btn-secondary" id="btn-gerar-parcelas">Gerar Parcelas</button></div>
          </div>
          <div id="tabela-parcelas-container" style="margin-top:10px; max-height:250px; overflow-y:auto; padding-right:4px;">
            <!-- Parcelas geradas entrarão aqui -->
          </div>
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Planta / Imagem do Projeto (Opcional)</label>
          <input type="file" class="form-control" id="f-imagem" accept="image/*" style="padding: 6px;">
          <img id="img-preview" src="" style="display:none; max-height:200px; margin-top:10px; border-radius:8px; object-fit:contain; width:100%; border:1px solid var(--border)">
        </div>

        <!-- Calculadora de desconto -->
        <div class="form-group col-span-2">
          <div class="desconto-calc">
            <label class="form-label">Calculadora de Desconto</label>
            <div class="form-row" style="align-items:center;gap:16px">
              <div class="form-group" style="flex:1;margin:0"><label class="form-label">Desconto (%)</label>
                <input type="number" class="form-control" id="f-desconto" placeholder="0" min="0" max="100" step="0.1">
              </div>
              <div style="font-size:13px;color:var(--text-3)">?</div>
              <div style="flex:2">
                <div style="font-size:12px;color:var(--text-3);margin-bottom:4px">Valor com desconto:</div>
                <div class="desconto-result" id="valor-desc">R$ 0,00</div>
                <div style="font-size:11px;color:var(--text-3)" id="economia-desc"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Alerta de prazo -->
      <div id="alerta-prazo" style="display:none" class="alert alert-warning">
        ⚠️ Atenção: o prazo de entrega está próximo ou vencido!
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="close-modal-2">Cancelar</button>
      <button class="btn btn-info" id="btn-preview">Preview</button>
      <button class="btn btn-primary" id="btn-salvar">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Preview/Impress-o -->
<div class="modal-overlay" id="modal-preview">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">Preview do Orçamento</span>
      <button class="modal-close" id="close-preview">✕</button>
    </div>
    <div class="modal-body">
      <div class="no-print" style="display:flex;gap:10px;margin-bottom:16px">
        <button class="btn btn-secondary" onclick="window.print()">🖨 Imprimir</button>
        <button class="btn btn-danger" id="btn-pdf">📄 Baixar PDF</button>
      </div>
      <div id="orcamento-preview-content" style="background:white;color:#111;padding:40px;border-radius:8px;font-family:'Inter',sans-serif"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatCurrency, formatDate, setupAutocomplete, setActivenav, setupMobileSidebar, confirmDialog, buildStatusBadge } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let allItems=[], clientes=[], tiposServico=[], statusList=[], editId=null, imagemProjetoBase64=null;

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.Nome||user.email,u.perfil||'Usuário');
  const [oSnap,cSnap,tSnap,sSnap]=await Promise.all([
    getDocs(query(collection(db,'orcamentos'),orderBy('criadoEm','desc'))),
    getDocs(collection(db,'clientes')), getDocs(collection(db,'tiposServico')),
    getDocs(query(collection(db,'statusServico'),orderBy('ordem')))
  ]);
  allItems=oSnap.docs.map(d=>({id:d.id,...d.data()}));
  clientes=cSnap.docs.map(d=>({id:d.id,...d.data()}));
  tiposServico=tSnap.docs.map(d=>({id:d.id,...d.data()}));
  statusList=sSnap.docs.map(d=>({id:d.id,...d.data()}));
  renderTable(allItems);

  const stSel=document.getElementById('f-status');
  statusList.forEach(s=>stSel.appendChild(new Option(s.Nome,s.id)));

  setupAutocomplete(document.getElementById('f-cliente'),document.getElementById('cli-auto'),
    clientes.map(c=>({id:c.id,label:c.nomeCompleto})), (i)=>document.getElementById('f-cliente-id').value=i.id);
  setupAutocomplete(document.getElementById('f-tipo'),document.getElementById('tipo-auto'),
    tiposServico.map(t=>({id:t.id,label:t.Nome})), (i)=>document.getElementById('f-tipo').value=i.label);
});

function renderSidebar(Nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = Nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">📋</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">📁️</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">📅</span>Calendário</a>
      <a href="orcamento.html"><span class="nav-icon">💰</span>Orçamentos</a>
      <a href="financeiro.html"><span class="nav-icon">💰</span>Financeiro</a>
      <a href="relatorios.html"><span class="nav-icon">📈</span>Relatórios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="colaboradores.html"><span class="nav-icon">👨‍💼</span>Colaboradores</a>
      <a href="clientes.html"><span class="nav-icon">👥</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">🏭</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">🧱</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">🔨</span>Serviços</a>
      <a href="tipos-despesas.html"><span class="nav-icon">📋</span>Tipos de Despesas</a>
      <a href="tipos-receitas.html"><span class="nav-icon">📋</span>Tipos de Receitas</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? '<a href="usuarios.html"><span class="nav-icon">👤</span>Usuários</a>' : ''}
      <a href="agenda.html"><span class="nav-icon">📚</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">💡</span>Sugestões</a>
      <a href="creditos.html"><span class="nav-icon">⭐</span>Créditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '🌙' : '☀️'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${Nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usuário'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>🚪</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActivenav();
  setupMobileSidebar();
}

function renderTable(list){
  const tbody=document.getElementById('list-tbody');
  if(!list.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div><h3>nenhum orçamento</h3></div></td></tr>`;return;}
  tbody.innerHTML=list.map(d=>{
    const st=statusList.find(s=>s.id===d.statusId);
    return `<tr>
      <td>${d.clienteNome||'-'}</td><td>${d.tipoServico||'-'}</td>
      <td>${formatCurrency(d.valorServico)}</td><td><strong style="color:var(--gold)">${formatCurrency(d.valorComDesconto)}</strong></td>
      <td>${formatDate(d.dataEntrega)}</td>
      <td>${buildStatusBadge(d.statusNome||'-',st?.cor)}</td>
      <td><div class="td-actions">
        <button class="btn btn-info btn-icon-sm" title="Visualizar" onclick="previewOrc('${d.id}')">👁️</button>
        <button class="btn btn-secondary btn-icon-sm" title="Editar" onclick="editItem('${d.id}')">✏️</button>
        ${d.arquivada
          ? `<button class="btn btn-success btn-icon-sm" title="Desarquivar" onclick="toggleArquivar('${d.id}', false)">📥</button>`
          : `<button class="btn btn-warning btn-icon-sm" title="Arquivar"    onclick="toggleArquivar('${d.id}', true)">🗃</button>`}
        <button class="btn btn-danger btn-icon-sm" title="Excluir" onclick="deleteItem('${d.id}')">🗑️</button>
      </div></td></tr>`;
  }).join('');
}

// Calculadora de desconto em tempo real
['f-valor','f-desconto'].forEach(id=>document.getElementById(id).addEventListener('input',calcDesconto));
function calcDesconto(){
  const val=parseFloat(document.getElementById('f-valor').value)||0;
  const pct=parseFloat(document.getElementById('f-desconto').value)||0;
  const desc=val*(pct/100);
  const final=val-desc;
  document.getElementById('valor-desc').textContent=final.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  document.getElementById('economia-desc').textContent=pct>0?`Economia: ${desc.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`:'';
}

// Calcular data de entrega
['f-data','f-prazo'].forEach(id=>document.getElementById(id).addEventListener('input',calcEntrega));
function calcEntrega(){
  const ds=document.getElementById('f-data').value; const dias=parseInt(document.getElementById('f-prazo').value);
  if(ds&&!isNaN(dias)){
    const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+dias);
    document.getElementById('f-entrega').value=d.toLocaleDateString('pt-BR');
    const now=new Date(); const alertEl=document.getElementById('alerta-prazo');
    alertEl.style.display=d<=now?'flex':'none';
  } else document.getElementById('f-entrega').value='';
}

// Lógica de Serviços Dinâmicos
function updateValorOrcamento() {
  const servicos = document.querySelectorAll('.servico-item');
  let somaAprovados = 0;
  servicos.forEach(s => {
    const isAprovado = s.querySelector('.s-aprovado').checked;
    if(isAprovado) {
      somaAprovados += parseFloat(s.querySelector('.s-valor').value) || 0;
    }
  });
  document.getElementById('f-valor').value = somaAprovados.toFixed(2);
  calcDesconto();
}

function addServicoRow(descricao = '', valor = 0, aprovado = true) {
  const container = document.getElementById('lista-servicos-container');
  const div = document.createElement('div');
  div.className = 'servico-item';
  div.style.cssText = 'display:flex; gap:10px; align-items:center; background:var(--surface); padding:10px; border-radius:6px; border:1px solid var(--border-subtle);';
  div.innerHTML = `
    <div style="flex:2"><input type="text" class="form-control s-desc" placeholder="Descrição do serviço" value="${descricao}"></div>
    <div style="flex:1"><input type="number" class="form-control s-valor" step="0.01" placeholder="Valor (R$)" value="${valor.toFixed(2)}"></div>
    <div style="flex:0; display:flex; align-items:center; gap:5px;">
      <input type="checkbox" class="s-aprovado" ${aprovado ? 'checked' : ''} style="width:20px; height:20px; cursor:pointer;"> 
      <small>Aprovado</small>
    </div>
    <div style="flex:0"><button type="button" class="btn btn-danger btn-icon-sm btn-remover-servico" title="Remover">🗑️</button></div>
  `;
  div.querySelector('.btn-remover-servico').addEventListener('click', () => { div.remove(); updateValorOrcamento(); });
  div.querySelector('.s-valor').addEventListener('input', updateValorOrcamento);
  div.querySelector('.s-aprovado').addEventListener('change', updateValorOrcamento);
  container.appendChild(div);
  updateValorOrcamento();
}
document.getElementById('btn-add-servico').addEventListener('click', () => addServicoRow());

// Lógica de Visibilidade de Pagamento
function updateVisibilidadePagamento() {
  const forma = document.getElementById('f-forma-pagamento').value;
  const opcao = document.getElementById('f-opcao-pagamento').value;
  const cStatus = document.getElementById('container-status-pagamento');
  const cData = document.getElementById('container-data-pagamento');
  const cValorPago = document.getElementById('container-valor-pago');
  const cParcela = document.getElementById('container-parcelamento');
  
  if (opcao === 'Parcelado') {
    cStatus.style.display = 'none'; cData.style.display = 'none'; cValorPago.style.display = 'none'; cParcela.style.display = 'block';
  } else if (forma !== '' || opcao !== '') {
    cStatus.style.display = 'block'; cData.style.display = 'block'; cValorPago.style.display = 'block'; cParcela.style.display = 'none';
  } else {
    cStatus.style.display = 'none'; cData.style.display = 'none'; cValorPago.style.display = 'none'; cParcela.style.display = 'none';
  }
}
document.getElementById('f-opcao-pagamento').addEventListener('change', updateVisibilidadePagamento);
document.getElementById('f-forma-pagamento').addEventListener('change', updateVisibilidadePagamento);

// Gerar Parcelas
document.getElementById('btn-gerar-parcelas').addEventListener('click', () => {
  const num = parseInt(document.getElementById('f-num-parcelas').value) || 0;
  if(num <= 0) return;
  const pctDesc = parseFloat(document.getElementById('f-desconto').value)||0;
  const valorTotal = (parseFloat(document.getElementById('f-valor').value)||0) * (1 - pctDesc/100);
  const valorParcela = valorTotal / num;
  
  const container = document.getElementById('tabela-parcelas-container');
  let html = '<div style="display:flex; flex-direction:column; gap:8px;">';
  const hoje = new Date();
  for(let i=1; i<=num; i++) {
    const venc = new Date(hoje); venc.setMonth(venc.getMonth() + i);
    const vencStr = venc.toISOString().split('T')[0];
    html += `
      <div class="parcela-item" data-num="${i}" style="display:flex; gap:10px; align-items:center; background:var(--surface); padding:10px; border-radius:6px; border:1px solid var(--border-subtle);">
        <div style="width:40px; font-weight:bold; text-align:center;">${i}x</div>
        <div style="flex:1"><input type="number" class="form-control p-valor" step="0.01" value="${valorParcela.toFixed(2)}" title="Valor da Parcela"></div>
        <div style="flex:1"><input type="date" class="form-control p-venc" value="${vencStr}" title="Vencimento"></div>
        <div style="flex:1.5">
          <select class="form-select p-status">
            <option value="Em Espera">Em Espera</option>
            <option value="Pagamento Efetivado">Efetivado</option>
          </select>
        </div>

document.getElementById('f-imagem').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 1200;
      let width = img.width, height = img.height;
      if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      imagemProjetoBase64 = canvas.toDataURL('image/jpeg', 0.8);
      const imgEl = document.getElementById('img-preview');
      imgEl.src = imagemProjetoBase64;
      imgEl.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('btn-pdf').addEventListener('click', async()=>{
  const btn = document.getElementById('btn-pdf');
  const oldText = btn.innerHTML;
  btn.innerHTML = 'Gerando...'; btn.disabled = true;
  
  // Remover os efeitos de separação de página para o html2canvas ler como um único elemento contínuo
  const wrapper = document.getElementById('preview-wrapper');
  if(wrapper) {
    wrapper.style.background = 'white';
    wrapper.style.padding = '0';
    wrapper.style.gap = '0';
    document.querySelectorAll('.print-page').forEach(p => p.style.boxShadow = 'none');
  }

  const el=document.getElementById('orcamento-preview-content');
  const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
  
  // Restaurar visualização paginada após capturar
  if(wrapper) {
    wrapper.style.background = '#e9ecef';
    wrapper.style.padding = '20px 0';
    wrapper.style.gap = '20px';
    document.querySelectorAll('.print-page').forEach(p => p.style.boxShadow = '0 4px 15px rgba(0,0,0,0.15)');
  }
  
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  
  const imgData=canvas.toDataURL('image/jpeg',0.95);
  const w=pdf.internal.pageSize.getWidth(); 
  const h=(canvas.height/canvas.width)*w;
  const pageHeight = pdf.internal.pageSize.getHeight();
  
  let heightLeft = h;
  let position = 0;
  
  pdf.addImage(imgData,'JPEG',0,position,w,h);
  heightLeft -= pageHeight;
  
  while(heightLeft > 5) { // 5px tolerance
    position -= pageHeight;
    pdf.addPage();
    pdf.addImage(imgData,'JPEG',0,position,w,h);
    heightLeft -= pageHeight;
  }
  
  pdf.save(`orcamento-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.pdf`);
  btn.innerHTML = oldText; btn.disabled = false;
});

  };
  try{
    if(editId){await updateDoc(doc(db,'orcamentos',editId),payload);allItems=allItems.map(d=>d.id===editId?{...d,...payload}:d);}
    else{const ref=await addDoc(collection(db,'orcamentos'),{...payload,criadoEm:serverTimestamp()});allItems.push({id:ref.id,...payload});}
    renderTable(allItems);closeModalFn();showToast(editId?'Orçamento atualizado!':'Orçamento salvo!','success');
  }catch(err){document.getElementById('form-alert').textContent=err.message;document.getElementById('form-alert').style.display='flex';}
});
</script>
</body>
</html>

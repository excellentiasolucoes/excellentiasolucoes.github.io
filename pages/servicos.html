<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Serviços — Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">?</button>
      <div><div class="topbar-title">Serviços</div><div class="topbar-subtitle">Tabela de preços</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btn-novo">+ Novo Serviço</button></div>
    </div>
    <div class="page-content">
      <div class="search-bar"><div class="search-input-wrapper"><span class="search-icon">??</span><input type="text" class="form-control" id="search-input" placeholder="Buscar serviço..."></div></div>
      <div class="card" style="padding:0">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Valor</th><th>Ações</th></tr></thead>
            <tbody id="list-tbody"><tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-3)">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-form">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">?? <span id="modal-titulo">Novo Serviço</span></span><button class="modal-close" id="close-modal">?</button></div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-danger" style="display:none"></div>
      <div class="form-group"><label class="form-label">Nome do Serviço</label>
        <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-nome" placeholder="Ex: Projeto Arquitetônico"><div class="autocomplete-list" id="nome-auto"></div></div>
      </div>
      <div class="form-group"><label class="form-label">Tipo de Serviço</label>
        <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-tipo" placeholder="Ex: Projeto Completo"><div class="autocomplete-list" id="tipo-auto"></div></div>
      </div>
      <div class="form-group"><label class="form-label">Valor (R$)</label>
        <input type="number" class="form-control" id="f-valor" placeholder="0,00" step="0.01" min="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="close-modal-2">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar">?? Salvar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatCurrency, setupAutocomplete, setActiveNav, setupMobileSidebar, confirmDialog } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let allItems=[], tiposServico=[], editId=null;

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.nome||user.email, u.perfil||'usuario');
  const [sSnap,tSnap]=await Promise.all([getDocs(query(collection(db,'servicos'),orderBy('nomeServico'))),getDocs(collection(db,'tiposServico'))]);
  allItems=sSnap.docs.map(d=>({id:d.id,...d.data()})); tiposServico=tSnap.docs.map(d=>({id:d.id,...d.data()}));
  renderTable(allItems);
  setupAutocomplete(document.getElementById('f-tipo'),document.getElementById('tipo-auto'),
    tiposServico.map(t=>({id:t.id,label:t.nome})), (i)=>{document.getElementById('f-tipo').value=i.label;});
  const nomeSugest=[...new Set(allItems.map(s=>s.nomeServico).filter(Boolean))].map(n=>({id:n,label:n}));
  setupAutocomplete(document.getElementById('f-nome'),document.getElementById('nome-auto'),nomeSugest,(i)=>{document.getElementById('f-nome').value=i.label;});
});

function renderSidebar(nome,perfil){
  const isAdmin=perfil==='admin'; const ini=nome.charAt(0).toUpperCase();
  document.getElementById('sidebar-placeholder').innerHTML=`<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
    <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">??</span>Dashboard</a><a href="demandas.html"><span class="nav-icon">??</span>Demandas</a>
      <a href="kanban.html"><span class="nav-icon">???</span>Kanban</a><a href="calendario.html"><span class="nav-icon">??</span>Calendário</a>
      <a href="orcamento.html"><span class="nav-icon">??</span>Orçamentos</a><a href="relatorios.html"><span class="nav-icon">??</span>Relatórios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">??</span>Clientes</a><a href="fornecedores.html"><span class="nav-icon">??</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">??</span>Materiais</a><a href="servicos.html"><span class="nav-icon">??</span>Serviços</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin?`<a href="usuarios.html"><span class="nav-icon">??</span>Usuários</a>`:''}
      <a href="agenda.html"><span class="nav-icon">??</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">??</span>Sugestões</a><a href="creditos.html"><span class="nav-icon">?</span>Créditos</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar">${ini}</div>
    <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdmin?'Administrador':'Usuário'}</div></div></div>
    <button class="btn-logout" id="btn-logout"><span>??</span> Sair</button></div>
  </aside><div class="sidebar-overlay" id="sidebar-overlay"></div>`;
  document.getElementById('btn-logout').addEventListener('click',async()=>{await signOut(auth);window.location.href='../login.html';});
  setActiveNav(); setupMobileSidebar();
}

function renderTable(list){
  const tbody=document.getElementById('list-tbody');
  if(!list.length){tbody.innerHTML=`<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">??</div><h3>Nenhum serviço</h3></div></td></tr>`;return;}
  tbody.innerHTML=list.map(d=>`<tr>
    <td>${d.nomeServico||'—'}</td><td>${d.tipoServico||'—'}</td><td>${formatCurrency(d.valorServico)}</td>
    <td><div class="td-actions">
      <button class="btn btn-secondary btn-icon-sm" onclick="editItem('${d.id}')">??</button>
      <button class="btn btn-danger btn-icon-sm" onclick="deleteItem('${d.id}')">??</button>
    </div></td></tr>`).join('');
}

document.getElementById('search-input').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  renderTable(q?allItems.filter(d=>(d.nomeServico||'').toLowerCase().includes(q)):allItems);
});

function openModal(id=null){
  editId=id; document.getElementById('form-alert').style.display='none';
  document.getElementById('modal-titulo').textContent=id?'Editar Serviço':'Novo Serviço';
  if(!id){['f-nome','f-tipo'].forEach(i=>document.getElementById(i).value='');document.getElementById('f-valor').value='';}
  document.getElementById('modal-form').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModalFn(){document.getElementById('modal-form').classList.remove('open');document.body.style.overflow='';editId=null;}
document.getElementById('btn-novo').addEventListener('click',()=>openModal());
['close-modal','close-modal-2'].forEach(id=>document.getElementById(id).addEventListener('click',closeModalFn));

window.editItem=async(id)=>{
  const d=allItems.find(x=>x.id===id); if(!d)return; openModal(id);
  document.getElementById('f-nome').value=d.nomeServico||'';document.getElementById('f-tipo').value=d.tipoServico||'';document.getElementById('f-valor').value=d.valorServico||'';
};
window.deleteItem=async(id)=>{
  if(!await confirmDialog('Excluir este serviço?'))return;
  await deleteDoc(doc(db,'servicos',id));allItems=allItems.filter(d=>d.id!==id);renderTable(allItems);showToast('Serviço excluído!','success');
};
document.getElementById('btn-salvar').addEventListener('click',async()=>{
  const payload={nomeServico:document.getElementById('f-nome').value.trim(),tipoServico:document.getElementById('f-tipo').value.trim(),
    valorServico:parseFloat(document.getElementById('f-valor').value)||0,atualizadoEm:serverTimestamp()};
  try{
    if(editId){await updateDoc(doc(db,'servicos',editId),payload);allItems=allItems.map(d=>d.id===editId?{...d,...payload}:d);}
    else{const ref=await addDoc(collection(db,'servicos'),{...payload,criadoEm:serverTimestamp()});allItems.push({id:ref.id,...payload});}
    renderTable(allItems);closeModalFn();showToast(editId?'Serviço atualizado!':'Serviço cadastrado!','success');
  }catch(err){document.getElementById('form-alert').textContent=err.message;document.getElementById('form-alert').style.display='flex';}
});
</script>
</body>
</html>

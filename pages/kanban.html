<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Kanban — Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">?</button>
      <div><div class="topbar-title">Kanban</div><div class="topbar-subtitle">Visualização por status</div></div>
      <div class="topbar-actions"><a href="nova-demanda.html" class="btn btn-primary">+ Nova Demanda</a></div>
    </div>
    <div class="page-content">
      <div id="kanban-board" class="kanban-board"></div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatDate, buildStatusBadge, setActiveNav, setupMobileSidebar } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, orderBy, serverTimestamp }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.nome||user.email,u.perfil||'usuario');
  await loadKanban();
});

function renderSidebar(nome,perfil){
  const isAdmin=perfil==='admin'; const ini=nome.charAt(0).toUpperCase();
  document.getElementById('sidebar-placeholder').innerHTML=`<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
    <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">??</span>Dashboard</a><a href="demandas.html"><span class="nav-icon">??</span>Demandas</a>
      <a href="kanban.html"><span class="nav-icon">???</span>Kanban</a><a href="calendario.html"><span class="nav-icon">??</span>Calendário</a>
      <a href="orcamento.html"><span class="nav-icon">??</span>Orçamentos</a><a href="relatorios.html"><span class="nav-icon">??</span>Relatórios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">??</span>Clientes</a><a href="fornecedores.html"><span class="nav-icon">??</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">??</span>Materiais</a><a href="servicos.html"><span class="nav-icon">??</span>Serviços</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin?`<a href="usuarios.html"><span class="nav-icon">??</span>Usuários</a>`:''}
      <a href="agenda.html"><span class="nav-icon">??</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">??</span>Sugestões</a><a href="creditos.html"><span class="nav-icon">?</span>Créditos</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar">${ini}</div>
    <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdmin?'Administrador':'Usuário'}</div></div></div>
    <button class="btn-logout" id="btn-logout"><span>??</span> Sair</button></div>
  </aside><div class="sidebar-overlay" id="sidebar-overlay"></div>`;
  document.getElementById('btn-logout').addEventListener('click',async()=>{await signOut(auth);window.location.href='../login.html';});
  setActiveNav(); setupMobileSidebar();
}

async function loadKanban(){
  const [dSnap,sSnap]=await Promise.all([
    getDocs(query(collection(db,'demandas'),orderBy('criadoEm','desc'))),
    getDocs(query(collection(db,'statusServico'),orderBy('ordem')))
  ]);
  const demandas=dSnap.docs.map(d=>({id:d.id,...d.data()})).filter(d=>!d.arquivada);
  const statusList=sSnap.docs.map(d=>({id:d.id,...d.data()}));

  const board=document.getElementById('kanban-board');
  board.innerHTML='';

  // "Sem Status" column
  const cols=[{id:'__none__',nome:'Sem Status',cor:'#6E7191'},...statusList];

  cols.forEach(status=>{
    const colDemandas=status.id==='__none__'
      ? demandas.filter(d=>!d.statusId)
      : demandas.filter(d=>d.statusId===status.id);

    const col=document.createElement('div');
    col.className='kanban-col';
    col.dataset.statusId=status.id;
    col.dataset.statusNome=status.nome;
    col.dataset.statusCor=status.cor||'#888';

    col.innerHTML=`
      <div class="kanban-col-header" style="border-left:4px solid ${status.cor||'#888'}">
        <span style="color:${status.cor||'#888'}">${status.nome}</span>
        <span style="background:${status.cor||'#888'}22;color:${status.cor||'#888'};border-radius:99px;padding:2px 8px;font-size:11px">${colDemandas.length}</span>
      </div>
      <div class="kanban-col-body" data-status-id="${status.id}" data-status-nome="${status.nome}" data-status-cor="${status.cor||'#888'}">
        ${colDemandas.map(d=>`
          <div class="kanban-card" data-id="${d.id}" data-status-id="${d.statusId||''}" data-status-nome="${d.statusNome||''}">
            <div class="kanban-card-num">#${d.numero||'—'} · ${formatDate(d.dataRegistro||d.criadoEm)}</div>
            <div class="kanban-card-title">${d.clienteNome||'Sem cliente'}</div>
            <div class="kanban-card-meta">${d.tipoServicoNome||'Sem tipo'}</div>
            ${d.dataEntrega?`<div class="kanban-card-meta" style="margin-top:4px">? ${formatDate(d.dataEntrega)}</div>`:''}
            <div style="margin-top:8px;display:flex;gap:6px">
              <a href="nova-demanda.html?id=${d.id}" class="btn btn-secondary btn-icon-sm" style="font-size:11px" title="Editar">??</a>
            </div>
          </div>`).join('')}
      </div>`;
    board.appendChild(col);
  });

  // SortableJS on each column body
  document.querySelectorAll('.kanban-col-body').forEach(body=>{
    Sortable.create(body, {
      group: 'kanban',
      animation: 200,
      ghostClass: 'kanban-sortable-ghost',
      chosenClass: 'kanban-sortable-chosen',
      onEnd: async(evt)=>{
        const cardId=evt.item.dataset.id;
        const toBody=evt.to;
        const newStatusId=toBody.dataset.statusId;
        const newStatusNome=toBody.dataset.statusNome;
        if(newStatusId===evt.item.dataset.statusId) return;
        try{
          await updateDoc(doc(db,'demandas',cardId),{
            statusId:newStatusId==='__none__'?'':newStatusId,
            statusNome:newStatusId==='__none__'?'':newStatusNome,
            atualizadoEm:serverTimestamp()
          });
          // Update counter badges
          document.querySelectorAll('.kanban-col').forEach(col=>{
            const count=col.querySelector('.kanban-col-body').children.length;
            const badge=col.querySelector('.kanban-col-header span:last-child');
            if(badge) badge.textContent=count;
          });
          showToast(`Status atualizado para "${newStatusNome}"`, 'success');
        } catch(err){ showToast('Erro ao atualizar: '+err.message,'error'); }
      }
    });
  });
}
</script>
</body>
</html>

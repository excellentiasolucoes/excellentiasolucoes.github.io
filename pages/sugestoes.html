<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sugestões — Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">?</button>
      <div><div class="topbar-title">Sugestões</div><div class="topbar-subtitle">Melhoria do sistema</div></div>
    </div>
    <div class="page-content">
      <!-- Form to submit -->
      <div class="card" style="max-width:680px;margin-bottom:28px">
        <div class="card-header"><div class="card-title"><span class="icon">??</span>Enviar Sugestão</div></div>
        <div id="sug-alert" class="alert alert-danger" style="display:none"></div>
        <div class="form-group">
          <label class="form-label">Sua Sugestão</label>
          <textarea class="form-control" id="sug-texto" rows="5" placeholder="Descreva sua sugestão de melhoria para o sistema..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Seu Nome (opcional)</label>
          <input type="text" class="form-control" id="sug-nome" placeholder="Como deseja ser identificado">
        </div>
        <button class="btn btn-primary" id="btn-enviar" style="width:100%;justify-content:center">?? Enviar Sugestão</button>
        <div id="sug-success" class="alert alert-success" style="display:none;margin-top:14px">Sugestão enviada com sucesso! Obrigado ??</div>
      </div>

      <!-- List (admin only) -->
      <div id="admin-area" style="display:none">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--gold)">?? Sugestões Recebidas <span id="sug-count" style="font-size:13px;color:var(--text-3)"></span></h3>
        <div id="sugestoes-list" style="display:flex;flex-direction:column;gap:14px"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatDateTime, setActiveNav, setupMobileSidebar, confirmDialog } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, deleteDoc, serverTimestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let isAdmin=false;

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  isAdmin=u.perfil==='admin';
  renderSidebar(u.nome||user.email,u.perfil||'usuario');
  if(isAdmin){document.getElementById('admin-area').style.display='block';await loadSugestoes();}
});

function renderSidebar(nome,perfil){
  const isAdm=perfil==='admin'; const ini=nome.charAt(0).toUpperCase();
  document.getElementById('sidebar-placeholder').innerHTML=`<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
    <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div></div>
    <nav class="sidebar-nav"><div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">??</span>Dashboard</a><a href="demandas.html"><span class="nav-icon">??</span>Demandas</a>
      <a href="kanban.html"><span class="nav-icon">???</span>Kanban</a><a href="calendario.html"><span class="nav-icon">??</span>Calendário</a>
      <a href="orcamento.html"><span class="nav-icon">??</span>Orçamentos</a><a href="relatorios.html"><span class="nav-icon">??</span>Relatórios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">??</span>Clientes</a><a href="fornecedores.html"><span class="nav-icon">??</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">??</span>Materiais</a><a href="servicos.html"><span class="nav-icon">??</span>Serviços</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdm?`<a href="usuarios.html"><span class="nav-icon">??</span>Usuários</a>`:''}
      <a href="agenda.html"><span class="nav-icon">??</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">??</span>Sugestões</a><a href="creditos.html"><span class="nav-icon">?</span>Créditos</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar">${ini}</div>
    <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdm?'Administrador':'Usuário'}</div></div></div>
    <button class="btn-logout" id="btn-logout"><span>??</span> Sair</button></div>
  </aside><div class="sidebar-overlay" id="sidebar-overlay"></div>`;
  document.getElementById('btn-logout').addEventListener('click',async()=>{await signOut(auth);window.location.href='../login.html';});
  setActiveNav(); setupMobileSidebar();
}

async function loadSugestoes(){
  const snap=await getDocs(query(collection(db,'sugestoes'),orderBy('criadoEm','desc')));
  const list=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('sug-count').textContent=`(${list.length})`;
  const container=document.getElementById('sugestoes-list');
  if(!list.length){container.innerHTML='<div class="empty-state"><div class="empty-icon">??</div><h3>Nenhuma sugestão</h3></div>';return;}
  container.innerHTML=list.map(s=>`
    <div class="card" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="font-size:13px;color:var(--gold);font-weight:600;margin-bottom:6px">${s.nomeUsuario||'Anônimo'} · ${formatDateTime(s.criadoEm)}</div>
          <p style="font-size:14px;color:var(--text-1);line-height:1.7">${s.texto||'—'}</p>
        </div>
        <button class="btn btn-danger btn-icon-sm" onclick="deleteSug('${s.id}')" style="margin-left:12px">??</button>
      </div>
    </div>`).join('');
}

window.deleteSug=async(id)=>{
  if(!await confirmDialog('Excluir esta sugestão?'))return;
  await deleteDoc(doc(db,'sugestoes',id)); showToast('Sugestão excluída!','success'); await loadSugestoes();
};

document.getElementById('btn-enviar').addEventListener('click',async()=>{
  const texto=document.getElementById('sug-texto').value.trim();
  const nome=document.getElementById('sug-nome').value.trim();
  document.getElementById('sug-alert').style.display='none'; document.getElementById('sug-success').style.display='none';
  if(!texto){document.getElementById('sug-alert').textContent='Escreva sua sugestão antes de enviar.';document.getElementById('sug-alert').style.display='flex';return;}
  try{
    await addDoc(collection(db,'sugestoes'),{texto,nomeUsuario:nome,criadoEm:serverTimestamp()});
    document.getElementById('sug-texto').value=''; document.getElementById('sug-nome').value='';
    document.getElementById('sug-success').style.display='flex';
    if(isAdmin) await loadSugestoes();
  }catch(err){document.getElementById('sug-alert').textContent=err.message;document.getElementById('sug-alert').style.display='flex';}
});
</script>
</body>
</html>

﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Agenda de Contatos &#8212; Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">&#9776;</button>
      <div><div class="topbar-title">Agenda de Contatos</div><div class="topbar-subtitle">Contatos profissionais</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btn-novo">+ Novo Contato</button></div>
    </div>
    <div class="page-content">
      <div class="search-bar"><div class="search-input-wrapper"><span class="search-icon">&#128269;</span><input type="text" class="form-control" id="search-input" placeholder="Buscar por Nome, empresa..."></div></div>
      <div id="contatos-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-form">
  <div class="modal">
    <div class="modal-header"><span class="modal-title"><span id="modal-titulo">Novo Contato</span></span><button class="modal-close" id="close-modal">✕</button></div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-danger" style="display:none"></div>
      <div class="form-grid">
        <div class="form-group col-span-2"><label class="form-label">Nome</label><input type="text" class="form-control" id="f-Nome" placeholder="Nome completo"></div>
        <div class="form-group"><label class="form-label">Cargo</label><input type="text" class="form-control" id="f-cargo" placeholder="Ex: Diretor"></div>
        <div class="form-group"><label class="form-label">Fun&#231;&#227;o</label><input type="text" class="form-control" id="f-funcao" placeholder="Ex: Aprova&#231;&#227;o de projetos"></div>
        <div class="form-group col-span-2"><label class="form-label">Empresa</label><input type="text" class="form-control" id="f-empresa" placeholder="Nome da empresa"></div>
        <div class="form-group"><label class="form-label">Contato 1</label><input type="text" class="form-control" id="f-c1" placeholder="(92) 99999-9999"></div>
        <div class="form-group"><label class="form-label">Contato 2</label><input type="text" class="form-control" id="f-c2" placeholder="(92) 99999-9999"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="close-modal-2">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar">&#128190; Salvar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, applyPhoneMask, setActivenav, setupMobileSidebar, confirmDialog } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let allItems=[], editId=null;

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.Nome||user.email,u.perfil||'Usu&#225;rio');
  await loadData();
  applyPhoneMask(document.getElementById('f-c1')); applyPhoneMask(document.getElementById('f-c2'));
});

function renderSidebar(Nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = Nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">&#128202;</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">&#128203;</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">&#128193;&#65039;</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">&#128197;</span>Calend&#225;rio</a>
      <a href="orcamento.html"><span class="nav-icon">&#128176;</span>Or&#231;amentos</a>
      <a href="relatorios.html"><span class="nav-icon">&#128200;</span>Relat&#243;rios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">&#128101;</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">&#127981;</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">&#129521;</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">&#128296;</span>Servi&#231;os</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? `<a href="usuarios.html"><span class="nav-icon">&#128100;</span>Usu&#225;rios</a>` : ''}
      <a href="agenda.html"><span class="nav-icon">&#128218;</span>Agenda de Contatos</a>
      <a href="suGestãoes.html"><span class="nav-icon">&#128161;</span>Sugest&#245;es</a>
      <a href="creditos.html"><span class="nav-icon">&#11088;</span>Cr&#233;ditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '&#127769;' : '&#9728;&#65039;'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${Nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usu&#225;rio'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>&#128682;</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActivenav();
  setupMobileSidebar();
}

async function loadData(){
  const snap=await getDocs(query(collection(db,'agendaContatos'),orderBy('Nome')));
  allItems=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderGrid(allItems);
}

function renderGrid(list){
  const grid=document.getElementById('contatos-grid');
  if(!list.length){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">&#128203;</div><h3>nenhum contato</h3><p>Clique em "+ Novo Contato".</p></div>`;return;}
  grid.innerHTML=list.map(d=>{
    const ini=(d.Nome||'?').charAt(0).toUpperCase();
    return `<div class="card" style="padding:18px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--navy);flex-shrink:0">${ini}</div>
        <div>
          <div style="font-size:14px;font-weight:700">${d.Nome||'Sem Nome'}</div>
          <div style="font-size:12px;color:var(--gold)">${d.cargo||''} ${d.cargo&&d.funcao?'�':''} ${d.funcao||''}</div>
        </div>
      </div>
      ${d.empresa?`<div style="font-size:12px;color:var(--text-3);margin-bottom:8px">?? ${d.empresa}</div>`:''}
      ${d.contato1?`<div style="font-size:12px;color:var(--text-2);margin-bottom:4px">?? ${d.contato1}</div>`:''}
      ${d.contato2?`<div style="font-size:12px;color:var(--text-2);margin-bottom:8px">?? ${d.contato2}</div>`:''}
      <div style="display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-subtle)">
        <button class="btn btn-secondary btn-sm" onclick="editItem('${d.id}')">&#9999;&#65039; Editar</button>
        <button class="btn btn-danger btn-sm"    onclick="deleteItem('${d.id}')">&#128465;&#65039;</button>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('search-input').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  renderGrid(q?allItems.filter(d=>(d.Nome||'').toLowerCase().includes(q)||(d.empresa||'').toLowerCase().includes(q)):allItems);
});

function openModal(id=null){
  editId=id; document.getElementById('form-alert').style.display='none';
  document.getElementById('modal-titulo').textContent=id?'Editar Contato':'novo Contato';
  if(!id){['f-Nome','f-cargo','f-funcao','f-empresa','f-c1','f-c2'].forEach(i=>document.getElementById(i).value='');}
  document.getElementById('modal-form').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModalFn(){document.getElementById('modal-form').classList.remove('open');document.body.style.overflow='';editId=null;}
document.getElementById('btn-novo').addEventListener('click',()=>openModal());
['close-modal','close-modal-2'].forEach(id=>document.getElementById(id).addEventListener('click',closeModalFn));

window.editItem=async(id)=>{
  const d=allItems.find(x=>x.id===id); if(!d)return; openModal(id);
  document.getElementById('f-Nome').value=d.Nome||''; document.getElementById('f-cargo').value=d.cargo||'';
  document.getElementById('f-funcao').value=d.funcao||''; document.getElementById('f-empresa').value=d.empresa||'';
  document.getElementById('f-c1').value=d.contato1||''; document.getElementById('f-c2').value=d.contato2||'';
};
window.deleteItem=async(id)=>{
  if(!await confirmDialog('Excluir este contato?'))return;
  await deleteDoc(doc(db,'agendaContatos',id)); allItems=allItems.filter(d=>d.id!==id); renderGrid(allItems); showToast('Contato exclu�do!','success');
};
document.getElementById('btn-salvar').addEventListener('click',async()=>{
  const payload={Nome:document.getElementById('f-Nome').value.trim(),cargo:document.getElementById('f-cargo').value.trim(),
    funcao:document.getElementById('f-funcao').value.trim(),empresa:document.getElementById('f-empresa').value.trim(),
    contato1:document.getElementById('f-c1').value.trim(),contato2:document.getElementById('f-c2').value.trim(),atualizadoEm:serverTimestamp()};
  try{
    if(editId){await updateDoc(doc(db,'agendaContatos',editId),payload);allItems=allItems.map(d=>d.id===editId?{...d,...payload}:d);}
    else{const ref=await addDoc(collection(db,'agendaContatos'),{...payload,criadoEm:serverTimestamp()});allItems.push({id:ref.id,...payload});}
    allItems.sort((a,b)=>(a.Nome||'').localeCompare(b.Nome||''));
    renderGrid(allItems); closeModalFn(); showToast(editId?'Contato atualizado!':'Contato salvo!','success');
  }catch(err){document.getElementById('form-alert').textContent=err.message;document.getElementById('form-alert').style.display='flex';}
});
</script>
</body>
</html>

﻿﻿﻿﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Materiais &#8212; Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">&#9776;</button>
      <div><div class="topbar-title">Materiais</div><div class="topbar-subtitle">Cadastro de materiais</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btn-novo">+ Novo Material</button></div>
    </div>
    <div class="page-content">
      <div class="search-bar"><div class="search-input-wrapper"><span class="search-icon">&#128269;</span><input type="text" class="form-control" id="search-input" placeholder="Buscar material..."></div></div>
      <div class="card" style="padding:0">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Tipo</th><th>Utiliza&#231;&#227;o</th><th>Fornecedor</th><th>Pre&#231;o</th><th>A&#231;&#245;es</th></tr></thead>
            <tbody id="list-tbody"><tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-3)">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-form">
  <div class="modal">
    <div class="modal-header"><span class="modal-title"><span id="modal-titulo">Novo Material</span></span><button class="modal-close" id="close-modal">?</button></div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-danger" style="display:none"></div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Tipo de Material</label>
          <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-tipo" placeholder="Ex: Cer�mica, Madeira..."><div class="autocomplete-list" id="tipo-auto"></div></div>
        </div>
        <div class="form-group"><label class="form-label">Utiliza&#231;&#227;o</label>
          <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-util" placeholder="Ex: Piso, Parede..."><div class="autocomplete-list" id="util-auto"></div></div>
        </div>
        <div class="form-group"><label class="form-label">Fornecedor</label>
          <div class="autocomplete-wrapper"><input type="text" class="form-control" id="f-forn-nome" placeholder="Nome do fornecedor"><div class="autocomplete-list" id="forn-auto"></div></div>
          <input type="hidden" id="f-forn-id">
        </div>
        <div class="form-group"><label class="form-label">Pre&#231;o (R$)</label>
          <input type="number" class="form-control" id="f-preco" placeholder="0,00" step="0.01" min="0">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="close-modal-2">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar">&#128190; Salvar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, formatCurrency, setupAutocomplete, setActiveNav, setupMobileSidebar, confirmDialog } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
let allItems=[], fornecedores=[], editId=null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='../login.html'; return; }
  const snap = await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.nome||user.email, u.perfil||'Usu&#225;rio');
  const [mSnap, fSnap] = await Promise.all([getDocs(query(collection(db,'materiais'),orderBy('tipoMaterial'))), getDocs(collection(db,'fornecedores'))]);
  allItems = mSnap.docs.map(d=>({id:d.id,...d.data()}));
  fornecedores = fSnap.docs.map(d=>({id:d.id,...d.data()}));
  renderTable(allItems);
  setupAutocomplete(document.getElementById('f-forn-nome'), document.getElementById('forn-auto'),
    fornecedores.map(f=>({id:f.id,label:f.nomeCompleto})),
    (item) => { document.getElementById('f-forn-id').value=item.id; }
  );
  const tiposSugest = [...new Set(allItems.map(m=>m.tipoMaterial).filter(Boolean))].map(t=>({id:t,label:t}));
  const utilSugest  = [...new Set(allItems.map(m=>m.utilizacaoMaterial).filter(Boolean))].map(u=>({id:u,label:u}));
  setupAutocomplete(document.getElementById('f-tipo'), document.getElementById('tipo-auto'), tiposSugest, (i)=>{document.getElementById('f-tipo').value=i.label;});
  setupAutocomplete(document.getElementById('f-util'), document.getElementById('util-auto'), utilSugest,  (i)=>{document.getElementById('f-util').value=i.label;});
});

function renderSidebar(nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">&#128202;</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">&#128203;</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">&#128193;&#65039;</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">&#128197;</span>Calend&#225;rio</a>
      <a href="orcamento.html"><span class="nav-icon">&#128176;</span>Or&#231;amentos</a>
      <a href="relatorios.html"><span class="nav-icon">&#128200;</span>Relat&#243;rios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">&#128101;</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">&#127981;</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">&#129521;</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">&#128296;</span>Servi&#231;os</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? `<a href="usuarios.html"><span class="nav-icon">&#128100;</span>Usu&#225;rios</a>` : ''}
      <a href="agenda.html"><span class="nav-icon">&#128218;</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">&#128161;</span>Sugest&#245;es</a>
      <a href="creditos.html"><span class="nav-icon">&#11088;</span>Cr&#233;ditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '&#127769;' : '&#9728;&#65039;'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usu&#225;rio'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>&#128682;</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActiveNav();
  setupMobileSidebar();
}

function renderTable(list) {
  const tbody=document.getElementById('list-tbody');
  if(!list.length){tbody.innerHTML=`<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">&#128203;</div><h3>Nenhum material</h3></div></td></tr>`;return;}
  tbody.innerHTML=list.map(d=>`<tr>
    <td>${d.tipoMaterial||'�'}</td><td>${d.utilizacaoMaterial||'�'}</td>
    <td>${d.fornecedorNome||'�'}</td><td>${formatCurrency(d.preco)}</td>
    <td><div class="td-actions">
      <button class="btn btn-secondary btn-icon-sm" onclick="editItem('${d.id}')">&#9999;&#65039;</button>
      <button class="btn btn-danger btn-icon-sm" onclick="deleteItem('${d.id}')">&#128465;&#65039;</button>
    </div></td></tr>`).join('');
}

document.getElementById('search-input').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  renderTable(q?allItems.filter(d=>(d.tipoMaterial||'').toLowerCase().includes(q)||(d.fornecedorNome||'').toLowerCase().includes(q)):allItems);
});

function openModal(id=null){
  editId=id; document.getElementById('form-alert').style.display='none';
  document.getElementById('modal-titulo').textContent=id?'Editar Material':'Novo Material';
  if(!id){['f-tipo','f-util','f-forn-nome','f-forn-id'].forEach(i=>document.getElementById(i).value=''); document.getElementById('f-preco').value='';}
  document.getElementById('modal-form').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModalFn(){document.getElementById('modal-form').classList.remove('open');document.body.style.overflow='';editId=null;}
document.getElementById('btn-novo').addEventListener('click',()=>openModal());
['close-modal','close-modal-2'].forEach(id=>document.getElementById(id).addEventListener('click',closeModalFn));

window.editItem=async(id)=>{
  const d=allItems.find(x=>x.id===id); if(!d)return; openModal(id);
  document.getElementById('f-tipo').value=d.tipoMaterial||''; document.getElementById('f-util').value=d.utilizacaoMaterial||'';
  document.getElementById('f-forn-nome').value=d.fornecedorNome||''; document.getElementById('f-forn-id').value=d.fornecedorId||'';
  document.getElementById('f-preco').value=d.preco||'';
};
window.deleteItem=async(id)=>{
  if(!await confirmDialog('Excluir este material?'))return;
  await deleteDoc(doc(db,'materiais',id)); allItems=allItems.filter(d=>d.id!==id); renderTable(allItems); showToast('Material exclu�do!','success');
};
document.getElementById('btn-salvar').addEventListener('click',async()=>{
  const fId=document.getElementById('f-forn-id').value;
  const fNome=document.getElementById('f-forn-nome').value.trim();
  const payload={tipoMaterial:document.getElementById('f-tipo').value.trim(),utilizacaoMaterial:document.getElementById('f-util').value.trim(),
    fornecedorId:fId,fornecedorNome:fNome,preco:parseFloat(document.getElementById('f-preco').value)||0,atualizadoEm:serverTimestamp()};
  try{
    if(editId){await updateDoc(doc(db,'materiais',editId),payload);allItems=allItems.map(d=>d.id===editId?{...d,...payload}:d);}
    else{const ref=await addDoc(collection(db,'materiais'),{...payload,criadoEm:serverTimestamp()});allItems.push({id:ref.id,...payload});}
    renderTable(allItems); closeModalFn(); showToast(editId?'Material atualizado!':'Material cadastrado!','success');
  }catch(err){document.getElementById('form-alert').textContent=err.message;document.getElementById('form-alert').style.display='flex';}
});
</script>
</body>
</html>

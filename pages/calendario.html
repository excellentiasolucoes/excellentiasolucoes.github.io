﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Calend�rio � Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">?</button>
      <div><div class="topbar-title">Calend�rio</div><div class="topbar-subtitle">Servi�os por data</div></div>
      <div class="topbar-actions"><a href="nova-demanda.html" class="btn btn-primary">+ Novo Projeto</a></div>
    </div>
    <div class="page-content">
      <div class="card">
        <div id="main-calendar"></div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">?? <span id="ev-title">Detalhes</span></span><button class="modal-close" id="close-detail">?</button></div>
    <div class="modal-body" id="ev-body"></div>
    <div class="modal-footer"><a id="ev-edit" href="#" class="btn btn-secondary">?? Editar</a><button class="modal-close btn btn-primary" id="close-detail-2">Fechar</button></div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { formatDate, formatDateTime, buildStatusBadge, setActiveNav, setupMobileSidebar } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);

onAuthStateChanged(auth, async(user)=>{
  if(!user){window.location.href='../login.html';return;}
  const snap=await getDoc(doc(db,'usuarios',user.uid)); const u=snap.exists()?snap.data():{};
  renderSidebar(u.nome||user.email,u.perfil||'Usu&#225;rio');
  await loadCalendar();
});

function renderSidebar(nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">&#128202;</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">&#128203;</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">&#128193;&#65039;</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">&#128197;</span>Calend&#225;rio</a>
      <a href="orcamento.html"><span class="nav-icon">&#128176;</span>Or&#231;amentos</a>
      <a href="relatorios.html"><span class="nav-icon">&#128200;</span>Relat&#243;rios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="clientes.html"><span class="nav-icon">&#128101;</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">&#127981;</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">&#129521;</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">&#128296;</span>Servi&#231;os</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? `<a href="usuarios.html"><span class="nav-icon">&#128100;</span>Usu&#225;rios</a>` : ''}
      <a href="agenda.html"><span class="nav-icon">&#128218;</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">&#128161;</span>Sugest&#245;es</a>
      <a href="creditos.html"><span class="nav-icon">&#11088;</span>Cr&#233;ditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '&#127769;' : '&#9728;&#65039;'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usu&#225;rio'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>&#128682;</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActiveNav();
  setupMobileSidebar();
}

async function loadCalendar(){
  const [dSnap,sSnap]=await Promise.all([getDocs(collection(db,'demandas')),getDocs(collection(db,'statusServico'))]);
  const statusMap={};
  sSnap.docs.forEach(d=>{ statusMap[d.id]=d.data(); });
  const demandas=dSnap.docs.map(d=>({id:d.id,...d.data()}));

  const events=[];
  demandas.forEach(d=>{
    if(d.dataServico){
      const dt=d.dataServico.toDate?d.dataServico.toDate():new Date(d.dataServico);
      events.push({
        id:d.id, title:`#${d.numero} ${d.clienteNome||'Sem cliente'}`,
        start:dt.toISOString().split('T')[0],
        color:statusMap[d.statusId]?.cor||'#C9A84C',
        extendedProps:{demanda:d,status:statusMap[d.statusId]}
      });
    }
    if(d.dataEntrega){
      const de=d.dataEntrega.toDate?d.dataEntrega.toDate():new Date(d.dataEntrega);
      events.push({
        id:d.id+'_e', title:`? Entrega: #${d.numero} ${d.clienteNome||''}`,
        start:de.toISOString().split('T')[0],
        color:'#E74C3C', textColor:'#fff',
        extendedProps:{demanda:d,status:statusMap[d.statusId],isEntrega:true}
      });
    }
  });

  const cal=new FullCalendar.Calendar(document.getElementById('main-calendar'),{
    initialView:'dayGridMonth', locale:'pt-br',
    headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,listWeek'},
    events, height:'auto',
    eventClick:(info)=>{
      const {demanda,status,isEntrega}=info.event.extendedProps;
      document.getElementById('ev-title').textContent=(isEntrega?'? Entrega: ':'')+`#${demanda.numero} � ${demanda.clienteNome||'Sem cliente'}`;
      document.getElementById('ev-edit').href=`nova-demanda.html?id=${demanda.id}`;
      document.getElementById('ev-body').innerHTML=`
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase">Status</span><br>
            ${buildStatusBadge(demanda.statusNome||'�',status?.cor)}</div>
          <div><span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase">Tipo de Servi�o</span><br>
            <span style="font-size:14px">${demanda.tipoServicoNome||'�'}</span></div>
          <div><span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase">Data do Servi�o</span><br>
            <span style="font-size:14px">${formatDate(demanda.dataServico)}</span></div>
          <div><span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase">Data de Entrega</span><br>
            <span style="font-size:14px">${formatDate(demanda.dataEntrega)}</span></div>
          <div><span style="font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase">Descri��o</span><br>
            <span style="font-size:13px;color:var(--text-2)">${demanda.descricao||'�'}</span></div>
        </div>`;
      document.getElementById('modal-detail').classList.add('open'); document.body.style.overflow='hidden';
    }
  });
  cal.render();
}

['close-detail','close-detail-2'].forEach(id=>{
  document.getElementById(id)?.addEventListener('click',()=>{
    document.getElementById('modal-detail').classList.remove('open'); document.body.style.overflow='';
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fornecedores &#8212; Excellentia Controll</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/logo.png">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn">&#9776;</button>
      <div><div class="topbar-title">Fornecedores</div><div class="topbar-subtitle">Cadastro de fornecedores</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btn-novo">+ Novo Fornecedor</button></div>
    </div>
    <div class="page-content">
      <div class="search-bar"><div class="search-input-wrapper"><span class="search-icon">&#128269;</span><input type="text" class="form-control" id="search-input" placeholder="Buscar por Nome, CPF/CnPJ..."></div></div>
      <div class="card" style="padding:0">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Nome</th><th>Tipo</th><th>CPF/CnPJ</th><th>E-mail</th><th>Contato</th><th>A&#231;&#245;es</th></tr></thead>
            <tbody id="list-tbody"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-3)">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-form">
  <div class="modal">
    <div class="modal-header"><span class="modal-title"><span id="modal-titulo">Novo Fornecedor</span></span><button class="modal-close" id="close-modal">✕</button></div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-danger" style="display:none"></div>
      <div class="form-grid">
        <div class="form-group col-span-2"><label class="form-label">Nome Completo</label><input type="text" class="form-control" id="f-Nome" placeholder="Nome completo"></div>
        <div class="form-group"><label class="form-label">Tipo</label><select class="form-select" id="f-tipo"><option value="">Selecionar</option><option value="PF">Pessoa F-sica</option><option value="PJ">Pessoa Jur-dica</option></select></div>
        <div class="form-group"><label class="form-label">CPF / CnPJ</label><input type="text" class="form-control" id="f-cpf" placeholder="000.000.000-00"></div>
        <div class="form-group col-span-2"><label class="form-label">Endere&#231;o Completo</label><input type="text" class="form-control" id="f-endereco"></div>
        <div class="form-group col-span-2"><label class="form-label">E-mail</label><input type="email" class="form-control" id="f-email"></div>
        <div class="form-group"><label class="form-label">Contato 1</label><input type="text" class="form-control" id="f-contato1"></div>
        <div class="form-group"><label class="form-label">Contato 2</label><input type="text" class="form-control" id="f-contato2"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="close-modal-2">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar">&#128190; Salvar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { firebaseConfig } from '../js/firebase/config.js';
import { showToast, applyCpfCnpjMask, applyPhoneMask, setActivenav, setupMobileSidebar, confirmDialog } from '../js/utils.js';
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js');
const { getAuth, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js');
const { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy }
  = await import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js');
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
let allItems = [], editId = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = '../login.html'; return; }
  const snap = await getDoc(doc(db, 'usuarios', user.uid));
  const u = snap.exists() ? snap.data() : {};
  renderSidebar(u.Nome || user.email, u.perfil || 'Usu&#225;rio');
  await loadData();
  applyCpfCnpjMask(document.getElementById('f-cpf'));
  applyPhoneMask(document.getElementById('f-contato1'));
  applyPhoneMask(document.getElementById('f-contato2'));
});

function renderSidebar(Nome, perfil) {
  const isAdmin = perfil === 'admin';
  const ini = Nome.charAt(0).toUpperCase();

  // Aplica tema salvo
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') document.body.classList.add('light-mode');
  window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    const icon  = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon)  icon.textContent  = isLight ? '\u{1F319}' : '\u2600\uFE0F';
    if (label) label.textContent = isLight ? 'Modo Escuro' : 'Modo Claro';
  };

  const isLight = document.body.classList.contains('light-mode');

  document.getElementById('sidebar-placeholder').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:10px;object-fit:cover" onerror="this.style.display='none'">
      <div class="sidebar-brand-text"><div class="name">Excellentia</div><div class="sub">Controll</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="dashboard.html"><span class="nav-icon">&#128202;</span>Dashboard</a>
      <a href="demandas.html"><span class="nav-icon">&#128203;</span>Projetos</a>
      <a href="kanban.html"><span class="nav-icon">&#128193;&#65039;</span>Kanban</a>
      <a href="calendario.html"><span class="nav-icon">&#128197;</span>Calend&#225;rio</a>
      <a href="orcamento.html"><span class="nav-icon">&#128176;</span>Or&#231;amentos</a>
      <a href="relatorios.html"><span class="nav-icon">&#128200;</span>Relat&#243;rios</a>
      <div class="sidebar-section-label">Cadastros</div>
      <a href="colaboradores.html"><span class="nav-icon">&#128104;&#8205;&#128188;</span>Colaboradores</a>
      <a href="clientes.html"><span class="nav-icon">&#128101;</span>Clientes</a>
      <a href="fornecedores.html"><span class="nav-icon">&#127981;</span>Fornecedores</a>
      <a href="materiais.html"><span class="nav-icon">&#129521;</span>Materiais</a>
      <a href="servicos.html"><span class="nav-icon">&#128296;</span>Servi&#231;os</a>
      <div class="sidebar-section-label">Outros</div>
      ${isAdmin ? `<a href="usuarios.html"><span class="nav-icon">&#128100;</span>Usu&#225;rios</a>` : ''}
      <a href="agenda.html"><span class="nav-icon">&#128218;</span>Agenda de Contatos</a>
      <a href="sugestoes.html"><span class="nav-icon">&#128161;</span>Sugest&#245;es</a>
      <a href="creditos.html"><span class="nav-icon">&#11088;</span>Cr&#233;ditos</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-theme-row">
        <button class="theme-toggle" id="sidebar-theme-toggle" onclick="window.toggleTheme()">
          <span id="theme-icon">${isLight ? '&#127769;' : '&#9728;&#65039;'}</span>
          <span id="theme-label">${isLight ? 'Modo Escuro' : 'Modo Claro'}</span>
        </button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar">${ini}</div>
        <div class="sidebar-user-info"><div class="u-name">${Nome}</div><div class="u-role">${isAdmin ? 'Administrador' : 'Usu&#225;rio'}</div></div>
      </div>
      <button class="btn-logout" id="btn-logout"><span>&#128682;</span> Sair</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>`;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = '../login.html';
  });
  setActivenav();
  setupMobileSidebar();
}

async function loadData() {
  const snap = await getDocs(query(collection(db, 'fornecedores'), orderBy('nomeCompleto')));
  allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderTable(allItems);
}

function renderTable(list) {
  const tbody = document.getElementById('list-tbody');
  if (!list.length) { tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">&#128203;</div><h3>nenhum fornecedor</h3><p>Clique em "+ Novo Fornecedor".</p></div></td></tr>`; return; }
  tbody.innerHTML = list.map(d => `<tr>
    <td>${d.nomeCompleto||'-'}</td><td>${d.tipo==='PF'?'Pessoa F-sica':d.tipo==='PJ'?'Pessoa Jur-dica':'-'}</td>
    <td>${d.cpfCnpj||'-'}</td><td>${d.email||'-'}</td><td>${d.contato1||'-'}</td>
    <td><div class="td-actions">
      <button class="btn btn-secondary btn-icon-sm" onclick="editItem('${d.id}')">&#9999;&#65039;</button>
      <button class="btn btn-danger btn-icon-sm"    onclick="deleteItem('${d.id}')">&#128465;&#65039;</button>
    </div></td></tr>`).join('');
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderTable(q ? allItems.filter(d => (d.nomeCompleto||'').toLowerCase().includes(q)||(d.cpfCnpj||'').includes(q)) : allItems);
});

function openModal(id=null) {
  editId = id; document.getElementById('form-alert').style.display='none';
  document.getElementById('modal-titulo').textContent = id ? 'Editar Fornecedor' : 'novo Fornecedor';
  if (!id) { ['f-Nome','f-cpf','f-endereco','f-email','f-contato1','f-contato2'].forEach(i => document.getElementById(i).value=''); document.getElementById('f-tipo').value=''; }
  document.getElementById('modal-form').classList.add('open'); document.body.style.overflow='hidden';
}
function closeModalFn() { document.getElementById('modal-form').classList.remove('open'); document.body.style.overflow=''; editId=null; }

document.getElementById('btn-novo').addEventListener('click', () => openModal());
['close-modal','close-modal-2'].forEach(id => document.getElementById(id).addEventListener('click', closeModalFn));

window.editItem = async (id) => {
  const d = allItems.find(x => x.id===id); if (!d) return; openModal(id);
  document.getElementById('f-Nome').value=d.nomeCompleto||''; document.getElementById('f-tipo').value=d.tipo||'';
  document.getElementById('f-cpf').value=d.cpfCnpj||''; document.getElementById('f-endereco').value=d.endereco||'';
  document.getElementById('f-email').value=d.email||''; document.getElementById('f-contato1').value=d.contato1||'';
  document.getElementById('f-contato2').value=d.contato2||'';
};
window.deleteItem = async (id) => {
  if (!await confirmDialog('Deseja excluir este fornecedor?')) return;
  await deleteDoc(doc(db,'fornecedores',id)); allItems=allItems.filter(d=>d.id!==id); renderTable(allItems); showToast('Fornecedor exclu-do!','success');
};

document.getElementById('btn-salvar').addEventListener('click', async () => {
  const payload = {
    nomeCompleto: document.getElementById('f-Nome').value.trim(), tipo: document.getElementById('f-tipo').value,
    cpfCnpj: document.getElementById('f-cpf').value.trim(), endereco: document.getElementById('f-endereco').value.trim(),
    email: document.getElementById('f-email').value.trim(), contato1: document.getElementById('f-contato1').value.trim(),
    contato2: document.getElementById('f-contato2').value.trim(), atualizadoEm: serverTimestamp()
  };
  try {
    if (editId) { await updateDoc(doc(db,'fornecedores',editId), payload); allItems=allItems.map(d=>d.id===editId?{...d,...payload}:d); }
    else { const ref=await addDoc(collection(db,'fornecedores'),{...payload,criadoEm:serverTimestamp()}); allItems.push({id:ref.id,...payload}); }
    renderTable(allItems); closeModalFn(); showToast(editId?'Fornecedor atualizado!':'Fornecedor cadastrado!','success');
  } catch(err) { document.getElementById('form-alert').textContent=err.message; document.getElementById('form-alert').style.display='flex'; }
});
</script>
</body>
</html>

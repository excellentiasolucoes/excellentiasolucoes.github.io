name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar js/firebase/config.js via Secrets
        env:
          API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
        run: |
          mkdir -p js/firebase
          printf '// Auto-gerado pelo GitHub Actions\nexport const firebaseConfig = {\n  apiKey: "%s",\n  authDomain: "%s",\n  projectId: "%s",\n  storageBucket: "%s",\n  messagingSenderId: "%s",\n  appId: "%s"\n};\n' \
            "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" \
            "$STORAGE_BUCKET" "$MESSAGING_SENDER_ID" "$APP_ID" \
            > js/firebase/config.js
          echo "config.js gerado:"
          cat js/firebase/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
